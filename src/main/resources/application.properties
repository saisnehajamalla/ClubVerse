spring.application.name=clubverse-backend

ai.moderation.enabled=false

spring.datasource.url=jdbc:h2:mem:clubverse
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# For PostgreSQL production, uncomment below and comment out H2 above:
# spring.datasource.url=jdbc:postgresql://localhost:5432/clubverse
# spring.datasource.username=postgres
# spring.datasource.password=Rsha@1056#
# spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

ai.moderation.url=${AI_MODERATION_URL:https://api.openai.com/v1/moderations}
ai.moderation.api-key=${AI_MODERATION_API_KEY:}
ai.moderation.model=${AI_MODERATION_MODEL:omni-moderation-latest}